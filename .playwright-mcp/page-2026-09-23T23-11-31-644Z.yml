          - generic [ref=f12e155]:
            - paragraph [ref=f12e156]: Count words quickly and easily. Highlight text and instantly get the word & char count.
            - paragraph [ref=f12e157]: "Simple Word Counter: Quickly Count Words and Characters Simple Word Counter accomplishes the task of counting words and characters that you've selected quickly.. Just by highlighting the text, a popup will immediately show the total word and character count. Key Features: • Instant Word and Character Count: Simply highlight any text and a tooltip will promptly display the total count of words and characters. • Customizable Tooltip: Manage the tooltip's visibility with a straightforward on/off toggle. PLEASE NOTICE: This extension does NOT function on all websites - it will function on most. Getting Started: 1. Download and install the Simple Word Counter extension from the Chrome Web Store. 2. Highlight the text you want to count on any webpage. A tooltip will automatically pop up near the selected text, showing the word and character count. Additional Settings: • To access more settings, click on the extension icon to open the popup. • In the popup, you can adjust the tooltip's display and set the default behavior for new websites. PLEASE NOTICE: This extension does NOT function on all websites - it will function on most."
