        - generic [ref=f13e188]:
          - generic [ref=f13e189]:
            - paragraph [ref=f13e190]: Count words and characters in selected text with a single click. Just right-click on any text to analyze it!
            - paragraph [ref=f13e191]: "Word Counter: The fastest way to count words and characters in any selected text on the web. No copying, no pasting, just select and count instantly. ✓ INSTANT COUNTS: Get word count, character count (with or without spaces), sentence count, and paragraph count in one click ✓ WORKS EVERYWHERE: Count text on any website, email, document, or social media platform ✓ MULTIPLE DISPLAY OPTIONS: Choose between in page popup (default), system notification, browser alert, or optional floating counter ✓ FLOATING COUNTER (OPTIONAL): Enable the floating counter in settings to see real time word count as you select text, no right click needed ✓ ACCURATE COUNTING: Advanced sentence detection handles abbreviations, ellipsis, and headings, matches popular word counter tools ✓ ZERO LIMITATIONS: Count text of any length with no restrictions ✓ PRIVACY FOCUSED: All counting happens locally, no data is ever transmitted Perfect for writers monitoring word limits, students working on essays, content creators optimizing SEO, professionals drafting emails, and anyone who needs quick text analysis. Two ways to use: • Right click on selected text and choose \"Word Counter\" for instant results • Enable floating counter in settings for automatic counting as you select text (requires page refresh) Simple, fast, and essential for anyone working with text online."
