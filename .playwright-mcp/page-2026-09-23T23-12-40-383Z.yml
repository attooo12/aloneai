        - heading "Overview" [level=2] [ref=f16e138]
        - generic [ref=f16e140]:
          - generic [ref=f16e141]:
            - paragraph [ref=f16e142]: Easily access to recent clipboards via context-menu or toolbar popup.
            - paragraph [ref=f16e143]: Clipboard Manager is an extension that let you easily store and view clipboard items via toolbar popup. You can also access up to 7 clipboard items via mouse right click (context-menu). Please note that, the add-on only stores clipboard items when you want to "paste" them. In other words, when you just copy an item, it is NOT stored to the memory. But, when you paste it to an editable area within a page, it will be stored to the memory. This way, only needed items will be saved to the memory. To access stored clipboard items, please open toolbar popup or right-click on an editable area and then choose clipboard manager in the right-click. Then, click on a desired clipboard item; and it will be inserted to the editable filed. Moreover, to switch the interface theme to dark, please press the moon icon in the top toolbar. If you have a feature request, or found a bug to report, please fill out the bug report form on the addon's homepage (https://mybrowseraddon.com/clipboard-manager.html).
          - button "See more" [ref=f16e144] [cursor=pointer]
