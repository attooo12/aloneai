      - generic [ref=f17e209]:
        - heading "Overview" [level=2] [ref=f17e211]
        - generic [ref=f17e213]:
          - generic [ref=f17e214]:
            - paragraph [ref=f17e215]: Powerful clipboard history manager. Save, search & organize everything you copy. Tags, shortcuts & unlimited storage.
            - paragraph [ref=f17e216]: "The first open source clipboard history manager Chrome extension. Get all of the productivity benefits of a clipboard history with none of the security risks. Clipboard History IO offers a simple, efficient, and secure way to manage your clipboard. When the clipboard monitor is enabled, everything you copy to your clipboard will be backed up and saved for easy access later. Never worry about losing important content in your clipboard again! 🛠 Features • Comprehensive Clipboard History Management: Access and modify a complete history of everything copied to your clipboard. • Favoriting and Tagging: Mark items as favorites or add tags for faster access through search or filters. • Customization: Adjust extension settings and themes to suit your preferences. • Import and Export: Easily import or export items, including those created by this extension or others like Clipboard History Pro. • Merging: Combine multiple items seamlessly using a powerful merge tool. • Floating Mode: Open the clipboard history in a separate persistent and resizable window. • Paste from Context Menu: Conveniently paste recently copied items directly from the context menu on any website. • Keyboard Shortcuts: Quickly paste items using keyboard shortcuts. • Cloud Sync (Pro): Manually or automatically store items in the cloud and access them from any of your devices. 🔒 Security & Privacy: Unrestricted access to your clipboard can raise serious privacy concerns. In an effort to be the most trustworthy clipboard history manager, Clipboard History is fully open-source. You can download or review the source code here: https://github.com/ayoung19/clipboard-history 📝 Changelog: https://github.com/ayoung19/clipboard-history/releases"
          - button "See more" [ref=f17e217] [cursor=pointer]
