      - generic [ref=f22e202]:
        - heading "Overview" [level=2] [ref=f22e204]
        - generic [ref=f22e206]:
          - generic [ref=f22e207]:
            - paragraph [ref=f22e208]: A super handy QR Code Generator / Creator for you.
            - paragraph [ref=f22e209]: "Converts your current page into a QR Code with one quick click. Generates QR Codes from free text and URLs on the fly. The highest-rated QR Code Generator in the Chrome Web Store. ★ QR Code Generator Highlights: ✓ Trusted by 800,000+ weekly active users. ✓ Privacy-friendly: no unnecessary permissions required. ✓ Adapts to your operating system’s Dark Mode to protect your eyes. ✓ Generate a QR Code for your current page with just one click. ✓ Free for everyone. ✓ Scan, analyze, decode, and read QR Codes. ✓ Scan QR Codes directly with your camera. ✓ Save and view your QR Code scan history. ✓ Create QR Codes in real time: Simply type to generate. ✓ Right-click to create a QR Code for your selection. ✓ Color and size customization. ✓ Option to download the QR Code as an image (PNG/SVG/SVG Code). ✓ “With Logo”: Customize your QR Code with a logo. ✓ Super fast and works offline. ✓ Supports hotkeys. Assign them at chrome://extensions/shortcuts ✓ Print your QR Code directly. ✓ Option to disable context menus available in Settings » Advanced. ✓ Adjustable error correction level (L/M/Q/H) for better scan reliability. ★★★★★ PLEASE RATE FIVE ★★★★★ If you like this extension, please write a review and rate us five stars. I’m looking forward to reading your comments. Updated on Sep 22, 2026 - Sharper image QR scanning, even for very blurry codes - still with no extra permissions. Internal tests: 98% to 100%. If another tool can scan it, so can we. Updated on Aug 28, 2026 - Greatly enhanced image-based QR code scanning success. Updated on June 27, 2026 - Added error correction level. You can now choose between Low (7%), Medium (15%), Quartile (25%), and High (30%) to balance QR Code density and scan reliability. Find it in Settings » Advanced. - Fixed a bug where customized color settings were not being saved. Updated on May 1, 2026 - Added camera-based QR Code scanning. You can now scan QR Codes directly with your camera. - Added scan history. You can save and view all QR Codes you have scanned. Updated on Dec 1, 2024 - Thanks to our user Braden Wardle, we've fixed an issue where the print feature did not function correctly. - Fixed minor style issues. Updated on Nov 18, 2024 - Thanks to our user \"E\", we've fixed the 'Multiple Fixed Popups' feature malfunction in v.10.3.10 - Fixed uninstall URL typo. Updated on Oct 26, 2024: - Resolved text rendering problem in dark theme. - Corrected issues with auto-switching between light and dark themes. - Removed the donation link to improve the UI's appearance. If you want to support us, just rate us five stars! :) Updated on Mar 23, 2024: - Resolved a problem where the context menu was not functioning. Updated on Feb 16, 2024: - Improved QR Scanner. - Minor fixes. Updated on January 31, 2024: - Significantly enhanced the reliability of our scanning feature – we're confident it's among the top online QR scanners now! - User Interface Enhancements. Updated on Jan 29, 2024: - Fixed the bug where customized color settings were not working. - Resolved the issue with QR codes containing Chinese, Japanese, or Korean characters not being scannable. - Corrected the transparent background bug. - Addressed the bug where the export size was incorrect. - Improved the success rate of scans. - Other minor fixes. Updated on Jan 18, 2024: - Now compatible with Manifest v3. - Improved QR-scanning feature significantly. - Added SVG export support (SVG or SVG Code). Updated on Feb 14, 2021: - Bug fixes. - Optimized code and resources. Updated on Feb 5, 2021: - Improved print feature. - Toggle between dark/light/auto modes as you wish. - Optimized code and resources (probably the fastest QR Code Generator in the Chrome Web Store). Updated on Jan 21, 2021: - Improved print feature. - Bug fixes. - Optimized code and resources. Updated on Jan 19, 2021: - Improved dark mode design. - Optimized code and resources. - Added a print button in the fixed popup window. Updated on Jan 10, 2021: - Automatically uses your OS's dark mode to protect your eyes. Updated on Jan 2, 2021: - Improved QR Code reader (decoder) when scanning a QR Code in an image. - Bug fixes and optimization. Updated on Nov 23, 2020: - Shortcut setting at chrome://extensions/shortcuts (we will add a link to this page in our next version). - Quick QR Code Generator is now rebranding to QR Code Generator. - Bug fixes and optimization. Updated on Nov 15, 2020: - Added the white frame (aka the “Quiet Zone”) around the generated QR Code. - Bug fixes. Updated on Jun 25, 2020: - Fixed a bug that would display the wrong UI on the options page. Updated on Jun 24, 2020: - Bug fixes. Updated on Apr 23, 2020: - Bug fixes. Updated on Jan 12, 2020: - Bug fixes. Updated on Dec 22, 2019: - Bug fixes. Updated on Dec 15, 2019: - Bug fixes. Updated on Oct 2, 2019: - Added “Open in a fixed window” feature. You can keep this QR Code on your screen without closing it. Updated on Aug 28, 2019: - Fixed a bug that would cause the Chrome Extension panel to show an error message. - New icon design. Updated on Aug 9, 2019: - Added Bulk QR Code Generator feature. You can generate more than one QR Code and download them in a “.ZIP” file. Updated on Aug 4, 2019: - Added “HD” / “With Logo” feature. Now you can generate your QR Code with a logo. - Bug fixes. Updated on Jun 28, 2019: - Bug fixes. Updated on May 1, 2019: - Up to 50 languages supported. - Fixed text mistakes in Chinese/Japanese languages. Updated on Apr 15, 2019: - Fixed QR Code reader bug (some CJK characters might mess up). Updated on Apr 5, 2019: - As requested, the downloaded image now has the size as a suffix. For instance: exported_qrcode_image_350.png. - Added “Runs offline” badge. Updated on Mar 25, 2019: - Fixed a bug where the QR Code scanner/reader was not showing up after restarting Chrome. Updated on Mar 17, 2019: - Added QR Scanner/Reader feature as you demanded. - Fixed the bug where the QR Code image size wrongly reset to 20px. - Added an option to turn off the context menus if you don’t like them. Updated on Mar 7, 2019: - Fixed a bug that may cause the size of your downloaded image to be unchangeable. - Added a Donation button. Thanks for supporting me. Updated on Dec 8, 2018: - Up to 7 languages supported. Updated on Dec 6, 2018: - Added two languages support. Updated on Dec 2, 2018: - Using “activeTab” to replace “tab” permission. There will be NO “read your browser history” warning any more :) Updated on Jan 15, 2018: - Fixed some small bugs. Updated on Dec 11, 2017: - Able to copy the image directly (try to paste it anywhere else, like “Photoshop”). Updated on Oct 2, 2017: - Removed the “default hotkey” feature - now you can customize it on your own. Just one click from the “settings”. - Added ContextMenu feature - now you can “Quick QR” anything with two simple right clicks. Updated on Jun 15, 2017: - Focus the input zone after the popup shows up - so you can type whatever you want to turn into a QR Code. - Now, you can use ALT+Q to open the QR Popup. If you want to change your shortcut, please go to chrome://extensions/configureCommands Updated on Jun 13, 2017: - Fixed a bug where the popup window might get blocked when clicking on the icon. Updated on Jun 2, 2017: - Now, you can enter more than one line instead of a single line. Updated on May 5, 2017: - Fixed a bug where the “save image” feature did not work correctly after making modifications to the QR Code. Updated on Apr 6, 2017: - Instantly updates the QR Code when you are typing. Updated on Feb 25, 2017: - Access the options in the popup (get what you need on the fly). - Fixed a bug that created images that couldn’t be transparent. Updated on Jan 14, 2017: - Transparent background. - Customizable colors and size. - You can find them in the Options page (Right-click on the icon and click “Options” to access). Updated on Jan 11, 2017: - Added retina-display rendering support. Updated on Jan 1, 2017: - Redesigned the layout. - Fixed small bugs."
