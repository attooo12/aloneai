        - heading "Overview" [level=2] [ref=f24e194]
        - generic [ref=f24e196]:
          - generic [ref=f24e197]:
            - paragraph [ref=f24e198]: Simple yet powerful Cookie Editor that allow you to quickly create, edit and delete cookies without leaving your tab.
            - paragraph [ref=f24e199]: "Cookie-Editor is designed to have a simple to use interface that let you do most standard cookie operations. It is ideal for developing and testing web pages or even manual management of cookies for your privacy. Be careful! Do not share your cookies with anyone you do not trust! Cookies can contain very sensitive information like your login information. If you share your cookies with someone, they could gain full access to your account and compromise it. Feature list: - List all cookies for the current tab. - Search your cookies. - Create, edit and delete your cookies. - Import and export your cookies in many formats (JSON, Netscape, Header string) - Quickly delete all cookies for the current tab. - Customizable: chose what extra data to see, what theme to use (light or dark), the amount of detail to see (advanced mode). Cookie-Editor can help you: - Develop web pages. - Improve your SEO work. - Manage your cookies for privacy. - Improve your browsing experience. Cookie-Editor believes in privacy. Your Cookies are safe and all of your data remains offline. For all feature requests or bug report, please visit the GitHub repository and fill an issue https://github.com/Moustachauve/cookie-editor"
          - button "See more" [ref=f24e200] [cursor=pointer]
