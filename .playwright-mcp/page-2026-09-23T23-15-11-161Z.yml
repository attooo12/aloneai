        - heading "Overview" [level=2] [ref=f27e211]
        - generic [ref=f27e213]:
          - generic [ref=f27e214]:
            - paragraph [ref=f27e215]: Simple yet powerful Cookie Editor that allow you to quickly create, edit and delete cookies without leaving your tab.
            - paragraph [ref=f27e216]: "Cookie Editor – Manage, Edit & Secure Your Cookies Easily Cookie Editor is a powerful yet easy-to-use tool designed for seamless cookie management. Whether you're a developer testing web pages or need manual control over cookies for privacy reasons, this extension provides all the essential cookie operations in a simple interface. ⚠️ Stay Safe! Never share your cookies with anyone you don’t trust. Cookies can store sensitive data, including login credentials. If someone gains access to your cookies, they may take full control of your account. 🔹 Key Features of Cookie Editor: ✅ View all cookies for the current tab ✅ Search, create, edit, and delete cookies effortlessly ✅ Import and export cookies in multiple formats (JSON) ✅ Instantly clear all cookies for the current tab ✅ Support customizing Clear browsing data 💡 Support our development To help Cookie Editor continue to improve its features, we display promotions for other useful extensions and banner ads. This helps us maintain and improve the tool to provide the best user experience. 🔥 Open source: https://github.com/buigiathanh/Cookie_Editor"
          - button "See more" [ref=f27e217] [cursor=pointer]
