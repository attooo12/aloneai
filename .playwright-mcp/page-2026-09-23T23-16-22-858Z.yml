      - generic [ref=f32e131]:
        - heading "Overview" [level=2] [ref=f32e133]
        - generic [ref=f32e135]:
          - generic [ref=f32e136]:
            - paragraph [ref=f32e137]: "What font is this? Identify any font on a web page or in an image: family, size, weight, colour, and every font the page uses."
            - paragraph [ref=f32e138]: "What font is this? Identify any font on a web page or in an image — in one click WhatFont turns any website into a type specimen. Hover over text to see the font that is really rendered, click it for the full CSS spec, or capture a logo to find the font inside an image. No DevTools, no \"Inspect Element\", no guessing. 🔍 IDENTIFY THE FONT ON ANY WEBSITE • Hover over text — the tooltip shows the font actually rendered, not the CSS fallback list • Click for the full spec: family, size, line height, weight, style and letter spacing • See the whole font stack with the family the browser really picked highlighted • Arrow keys walk the page structure, so even the smallest caption is easy to reach 🖼️ FIND THE FONT IN AN IMAGE OR LOGO • Select any area of the screen: a logo, a banner, a screenshot, a video frame • Send it to Adobe Fonts or WhatTheFont visual search in one click • Or save the crop as PNG and copy it to the clipboard for your own reference 🗂️ ALL FONTS USED ON THE PAGE • One click lists every typeface the page renders • For each one: how many elements use it, which weights and which sizes • Copy the name or jump straight to that text on the page 🎨 COLOURS, CONTRAST AND READY-MADE CSS • Text colour in HEX and RGB — click any value to copy it • WCAG contrast ratio against the real background, with an AA / AAA verdict • Copy CSS: the whole font declaration, ready to paste into your stylesheet • Font source: Google Fonts, Adobe Fonts, self-hosted or a system font, with a link to it ⚡ HOW IT WORKS 1. Click the WhatFont icon or press Alt+Shift+F 2. Hover over any text to see its font 3. Click the text for the full spec, or press Capture to identify a font inside an image 4. Press Esc to switch the inspector off FOR DESIGNERS AND DEVELOPERS Collect typography references, rebuild a design system, match a client's brand font, check whether text colours are accessible, or simply answer \"what font does this website use?\" in seconds. 🔒 PRIVACY WhatFont works inside your browser and does not collect or transmit your browsing data. A captured image leaves the browser only after you choose a font search service yourself. ——————————— WhatFont — a free font finder and font identifier for Chrome. Hover over text to see what font a website uses, inspect the full CSS spec (family, size, weight, colour), check WCAG contrast, list every font on the page, and identify fonts from images, logos and screenshots with Adobe Fonts or WhatTheFont visual search."
