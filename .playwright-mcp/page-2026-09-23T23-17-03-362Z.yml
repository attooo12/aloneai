      - generic [ref=f35e220]:
        - heading "Overview" [level=2] [ref=f35e222]
        - generic [ref=f35e224]:
          - generic [ref=f35e225]:
            - paragraph [ref=f35e226]: Measure page elements size in pixel with an easy-to-use ruler.
            - paragraph [ref=f35e227]: Page Ruler is an extension that lets you measure distances (in pixels) on a webpage. It draws a rectangular ruler when you move your mouse on the page. The ruler has width, height, start and end all labeled with corresponding metrics in pixels. When you move your mouse, the rectangle changes its size and all the numerics are updated. To activate the addon please press the toolbar button once. Likewise, to disable the addon please press the toolbar button again. This addon works with mouse clicks in desktop machines. For touch-enabled devices, you can work with touch to draw the rectangle within the page. If you have a feature request in mind or found a bug to report, please fill the bug report form on the addon's homepage (https://mybrowseraddon.com/page-ruler.html).
          - button "See more" [ref=f35e228] [cursor=pointer]
