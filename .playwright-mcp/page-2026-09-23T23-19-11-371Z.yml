        - heading "Overview" [level=2] [ref=f39e183]
        - generic [ref=f39e185]:
          - generic [ref=f39e186]:
            - paragraph [ref=f39e187]: Identify fonts on any web page with a single click
            - paragraph [ref=f39e188]: The most accurate font identifier for Chrome — and the only one that lets you download fonts. FontScout uses a multi-step detection pipeline to resolve the true font name — parsing the actual font binary, matching weight-aware font-face rules, decoding hashed filenames, and more. Where other extensions stop at CSS, FontScout keeps digging. WHY FONTSCOUT Most accurate — real font names via OpenType file parsing, not CSS guessing Download any font — as a ZIP with the original file, decompressed TTF/OTF, license info, and a README Editable preview — type your own text to see how the font looks with your content HOW IT WORKS Click the FontScout icon to activate. Hover over any text to see the font name, then click for full details — weight, size, line-height, color, and more. Press ESC to deactivate. FEATURES • Editable preview — type your own text to see how the font looks • Download font as ZIP — original file, decompressed TTF/OTF, license, and README • One-click copy of any CSS property • Shift+click to open multiple tooltips for side-by-side comparison • Font name cursor label on hover before you click • Adobe Fonts / TypeKit detection • System font detection — shows the actual font behind generic keywords like system-ui or sans-serif • Font format display (WOFF2, WOFF, TTF, OTF) • Color in hex, rgb, hsl — hover the swatch for all formats including original CSS value (lab, oklch, etc.) • Light and dark theme PRIVACY No data collected. Everything runs locally. No background activity — activates only when you click the icon. ---------- Changelog 1.0.2 - Fixed font name detection on Wix, Squarespace, and other platforms that use hashed/obfuscated CSS font names — FontScout now reads the real name directly from the font file instead of showing internal identifiers like "wfont_343a2a_4e484..." - Fixed font preview in the tooltip not rendering the correct font on sites where the CSS font stack starts with an internal alias 1.0.1 - Generic CSS font keywords (system-ui, sans-serif, monospace, etc.) now resolve to the actual rendered system font instead of showing the generic keyword name 1.0.0 - Initial release
