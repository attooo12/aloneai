<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab Lifeboat</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 400px; padding: 10px 12px 8px; }
  .top { justify-content: space-between; margin-bottom: 8px; }
  .top .brand { display: flex; align-items: center; gap: 7px; }
  .top .brand img { width: 20px; height: 20px; }
  .icon { padding: 3px 8px; font-size: 13px; }
  #name { width: 100%; margin-bottom: 6px; }
  .savebtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .savebtns button { width: 100%; padding: 7px 6px; }
  .savebtns .count { font-weight: 400; opacity: .85; }
  #cap { margin: 5px 0 0; }
  .status { min-height: 18px; margin: 6px 0 2px; font-size: 12px; }
  .status button { padding: 1px 7px; margin-left: 6px; }
  .tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 4px 0 6px; }
  .tabbar button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 8px; color: var(--muted); }
  .tabbar button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  #q { width: 100%; margin-bottom: 6px; }
  #selbar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; }
  #selbar .grow { flex: 1; }
  #list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 5px; background: var(--card); }
  .item .head { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; }
  .item input[type=checkbox] { margin: 0; flex: none; }
  .item .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 3px 2px; }
  .item .nm { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .restore { flex: none; }
  .badge { font-size: 10px; padding: 0 5px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); margin-left: 4px; font-weight: 400; }
  .details { border-top: 1px solid var(--border); padding: 6px 8px 8px; }
  .details .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .details .actions button { font-size: 12px; padding: 3px 7px; }
  .win-h { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; color: var(--muted); margin: 6px 0 2px; }
  .win-h button { font-size: 11px; padding: 1px 6px; font-weight: 400; }
  .grp { font-size: 11px; font-weight: 600; margin: 5px 0 1px; display: flex; align-items: center; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .tl button:hover { background: var(--bg); }
  .tl .host { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .tl .pin { margin-right: 4px; }
  .grouped { border-left: 3px solid var(--border); padding-left: 4px; margin-left: 2px; }
  .rename { display: flex; gap: 4px; margin-bottom: 6px; }
  .rename input { flex: 1; }
  #empty { text-align: center; padding: 18px 8px; }
  #more { width: 100%; margin-top: 2px; }
</style>
</head>
<body>
<header class="row top">
  <div class="brand"><img src="icons/icon32.png" alt=""><h1>Tab Lifeboat</h1><span id="plan" class="pill">Free</span></div>
  <button id="settings" class="icon" type="button" title="Settings, backup, export and import">Settings</button>
</header>

<section aria-label="Save">
  <label for="name" class="sr-only">Session name (optional)</label>
  <input id="name" type="text" maxlength="120" autocomplete="off" placeholder="Name this session (optional)">
  <div class="savebtns">
    <button id="save-window" class="primary" type="button">Save this window <span class="count" id="count-window"></span></button>
    <button id="save-all" type="button">Save all windows <span class="count" id="count-all"></span></button>
  </div>
  <p id="cap" class="small muted"></p>
</section>

<div id="status" class="status" role="status" aria-live="polite"></div>

<div class="tabbar" role="tablist" aria-label="Session lists">
  <button type="button" role="tab" id="tab-named" aria-selected="true" aria-controls="panel">Saved <span id="n-named" class="muted"></span></button>
  <button type="button" role="tab" id="tab-auto" aria-selected="false" aria-controls="panel" tabindex="-1">Auto snapshots <span id="n-auto" class="muted"></span></button>
</div>

<div id="panel" role="tabpanel" aria-labelledby="tab-named">
  <input id="q" type="search" autocomplete="off" placeholder="Search names, tab titles and addresses" aria-label="Search sessions">
  <div id="selbar" hidden>
    <span id="selcount" class="grow"></span>
    <button id="merge" type="button">Merge into new session</button>
    <button id="del-sel" type="button">Delete</button>
    <button id="sel-clear" type="button">Clear</button>
  </div>
  <p id="auto-note" class="small muted" hidden>Taken automatically every few minutes, when a window closes, and at browser start. Protected snapshots (after a sudden drop in tabs) are never rotated out.</p>
  <ul id="list" aria-label="Sessions"></ul>
  <p id="empty" class="muted" hidden></p>
  <button id="more" type="button" hidden>Show more</button>
</div>

<footer>Local only · no account · no tracking · made by AloneAI, an AI agent</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
